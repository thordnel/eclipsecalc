<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Same Day Finder</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2c2c2c">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
/* Body & Layout */
*, *::before, *::after {
    box-sizing: border-box;
}

body {
    font-family: 'Helvetica', serif;
    background: #2c2c2c;
    color: #e0e0e0;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
}

/* Card container */
.container {
    background: #3a3a3a;
    max-width: 720px;
    width: 100%;
    padding: 30px 40px;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    transition: 0.3s ease;
}

/* Headings */
h2 {
    text-align: center;
    margin-bottom: 5px;
    font-weight: 700;
    color: #f0f0f0;
}

h2 + h3 {
    text-align: center;
    font-style: italic;
    margin-top: 0;
    margin-bottom: 30px;
    font-weight: normal;
    color: #aaa;
}

/* Inputs & Select */
input[type="number"],
input[type="text"],
select {
    width: 100%;
    max-width: 100%;
    padding: 12px 14px;
    margin-top: 6px;
    margin-bottom: 20px;
    border: 1px solid #555;
    border-radius: 12px;
    font-size: 16px;
    font-family: sans-serif;
    transition: 0.2s;
    background: #4a4a4a;
    color: #fff;
    -webkit-appearance: none;
    appearance: none;
}

input:focus, select:focus {
    border-color: #d48846;
    box-shadow: 0 0 8px rgba(212, 136, 70, 0.3);
    outline: none;
}

/* Radio buttons inline */
.radio-group {
    margin-bottom: 20px;
}

.radio-group label {
    margin-right: 20px;
    font-weight: normal;
    cursor: pointer;
}

/* Buttons */
button {
    padding: 12px 22px;
    font-size: 16px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    margin-right: 10px;
    transition: all 0.3s ease;
}

button#findBtn {
    background: linear-gradient(135deg, #d48846, #b06b32);
    color: white;
}

button#findBtn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.18);
}

button#downloadBtn {
    background: linear-gradient(135deg, #c27e3e, #9e632e);
    color: white;
}

/* Results box */
#output {
    border: 1px solid #444;
    border-radius: 12px;
    padding: 14px;
    height: 300px;
    overflow-y: auto;
    white-space: pre-wrap;
    background-color: #222;
    color: #ccc;
    font-family: monospace;
}

.pyodide-credit {
    text-align: center;
    font-size: 13px;
    color: #888;
    margin: 28px 0 8px;
}
.pyodide-credit a { color: #d48846; text-decoration: none; }

@media (max-width: 600px) {
    button { width: 100%; margin: 8px 0; }
}
</style>
</head>
<body>

<div class="container">
    <h2>Same Day Finder</h2>
    <h3>"Any day, any time"</h3>

    <label>Target Weekday:</label>
    <select id="weekdayInput">
        <option value="0">Monday</option>
        <option value="1">Tuesday</option>
        <option value="2">Wednesday</option>
        <option value="3" selected>Thursday</option>
        <option value="4">Friday</option>
        <option value="5">Saturday</option>
        <option value="6">Sunday</option>
    </select>

    <label>Day of Month:</label>
    <input id="dayInput" type="number" min="1" max="31" value="24">

    <label>Filter months (comma-separated, optional):</label>
    <input id="monthFilter" type="text" placeholder="e.g. 1,3,5">

    <label>Filter years (comma-separated, optional):</label>
    <input id="yearFilter" type="text" placeholder="e.g. 1870, 1900">

    <div class="radio-group">
        <label><input type="radio" name="cal" value="greg" checked> Gregorian</label>
        <label><input type="radio" name="cal" value="jul"> Julian</label>
    </div>

    <button id="findBtn">Find Dates</button>
    <button id="downloadBtn">Download Results</button>

    <h3>Results</h3>
    <div id="output"></div>
    <footer class="pyodide-credit">
        This site uses <a href="https://pyodide.org/" target="_blank">Pyodide</a>.
    </footer>
</div>

<script src="pyodide/pyodide.js"></script>
<script>
async function main() {
    const pyodide = await loadPyodide({ indexURL: "./pyodide/" });

    const pythonCode = `
from datetime import datetime, timedelta
from collections import defaultdict
from js import document, window
from pyodide.ffi import create_proxy

def find_matching_days(target_day, target_weekday, filter_months, filter_years=None):
    years = filter_years if filter_years else range(1870, 1933)
    months = range(1, 13)
    out = defaultdict(list)
    for y in years:
        for m in months:
            try:
                # weekday() returns 0-6 (Mon-Sun)
                if datetime(y, m, target_day).weekday() == target_weekday:
                    if not filter_months or m in filter_months:
                        out[y].append(m)
            except:
                continue
    return out

def julian_to_gregorian(jy, jm, jd):
    offset = 12 if 1870 <= jy <= 1899 else 13
    try:
        dt = datetime(jy, jm, jd)
        dt2 = dt + timedelta(days=offset)
        return dt2.year, dt2.month, dt2.day
    except:
        return None, None, None

def find_matching_days_julian(target_day, target_weekday, filter_months, filter_years=None):
    years = filter_years if filter_years else range(1870, 1924)
    months = range(1, 13)
    out = defaultdict(list)
    for y in years:
        for m in months:
            gy, gm, gd = julian_to_gregorian(y, m, target_day)
            if gd is None:
                continue
            if datetime(gy, gm, gd).weekday() == target_weekday:
                if not filter_months or m in filter_months:
                    out[y].append(m)
    return out

def parse_filter(s):
    if not s or not s.strip():
        return None
    res = set()
    for part in s.split(','):
        part = part.strip()
        if not part: continue
        if '-' in part:
            start, end = map(int, part.split('-'))
            res.update(range(start, end + 1))
        else:
            res.add(int(part))
    return list(res)

def compute(day, weekday, mode, month_filter_str, year_filter_str):
    try:
        f_months = parse_filter(month_filter_str)
        f_years = parse_filter(year_filter_str)
    except:
        return "Invalid filters."
            
    if mode == "greg":
        res = find_matching_days(day, weekday, f_months, f_years)
    else:
        res = find_matching_days_julian(day, weekday, f_months, f_years)
        
    lines = []
    weekday_name = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"][weekday]
    lines.append(f"Searching for {weekday_name} the {day}th:")
    lines.append("-" * 30)
    
    for year in sorted(res.keys()):
        names = [datetime(year, m, 1).strftime("%B") for m in res[year]]
        lines.append(f"{year}: {day} {', '.join(names)}")
    
    return "\\n".join(lines) if len(lines) > 2 else "No matches found."

def run_calc(ev=None):
    day = int(document.getElementById("dayInput").value)
    weekday = int(document.getElementById("weekdayInput").value)
    mode = document.querySelector('input[name="cal"]:checked').value
    month_filter_str = document.getElementById("monthFilter").value
    year_filter_str = document.getElementById("yearFilter").value
    
    result = compute(day, weekday, mode, month_filter_str, year_filter_str)
    document.getElementById("output").textContent = result
    window.last_output = result

run_calc_proxy = create_proxy(run_calc)
document.getElementById("findBtn").addEventListener("click", run_calc_proxy)
run_calc()
`;
    await pyodide.runPythonAsync(pythonCode);

    document.getElementById("downloadBtn").addEventListener("click", function () {
        if (!window.last_output) return;
        const blob = new Blob([window.last_output], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "date_finder_results.txt";
        a.click();
        URL.revokeObjectURL(url);
    });
}
main().catch(err => console.error(err));
</script>

</body>
</html>
